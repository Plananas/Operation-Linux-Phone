# Bluetooth output for TREND OS: trendbt:DEV=XX:XX:XX:XX:XX:XX
# Always 44.1 kHz at the BlueALSA end, which btaudio asks for with --a2dp-force-audio-cd. Other
# rates are resampled here. Asking BlueALSA for a different rate makes it renegotiate the codec,
# which fails with BlueZ ("Transport already configured") and destroys the stream.
pcm.trendbt {
	@args [ DEV ]
	@args.DEV {
		type string
	}
	type plug
	slave {
		pcm {
			type bluealsa
			device $DEV
			profile "a2dp"
		}
		rate 44100
	}
}
