# Bluetooth output for TREND OS: trendbt:DEV=XX:XX:XX:XX:XX:XX
# Always 44.1 kHz stereo at the BlueALSA end, which btaudio asks for with --a2dp-force-audio-cd.
# Anything else is converted here. Asking BlueALSA for a different rate or channel count makes it
# renegotiate the codec, which fails with BlueZ ("Transport already configured") and destroys the
# stream.
pcm.trendbt {
	@args [ DEV ]
	@args.DEV {
		type string
	}
	type plug
	slave {
		pcm {
			type bluealsa
			device $DEV
			profile "a2dp"
		}
		rate 44100
		channels 2
		format S16_LE
	}
}
